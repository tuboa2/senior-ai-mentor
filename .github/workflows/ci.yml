name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit and integration tests (46 tests)
        run: |
          python -m unittest discover tests -v

      - name: Verify CLI commands
        run: |
          mentor --version
          mentor --status
          mentor --skills

      - name: Test standalone Tier 0 audit scripts
        run: |
          python .agents/skills/statistical-validation/scripts/validate_stats.py --sample-a 0.85,0.86,0.84 --sample-b 0.80,0.81,0.79
          python .agents/skills/data-leakage-detection/scripts/leakage_checker.py --code senior_mentor/orchestrator.py
          python .agents/skills/python-engineering-standards/scripts/lint_ml_code.py senior_mentor/cli.py senior_mentor/orchestrator.py
